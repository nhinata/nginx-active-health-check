x-backend: &backend
  image: nginx:1.30-alpine
  command:
    - sh
    - -c
    - |
      echo "$$HOSTNAME" > /usr/share/nginx/html/index.html
      echo ok > /usr/share/nginx/html/health.html
      exec nginx -g 'daemon off;'

services:
  nginx:
    build:
      context: ./docker/nginx
    container_name: nginx_container
    environment:
      TZ: Asia/Tokyo
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend01
      - backend02
      - backend03
      - backend04
      - backend05

  backend01:
    <<: *backend
    hostname: backend01
  backend02:
    <<: *backend
    hostname: backend02
  backend03:
    <<: *backend
    hostname: backend03
  backend04:
    <<: *backend
    hostname: backend04
  backend05:
    <<: *backend
    hostname: backend05
