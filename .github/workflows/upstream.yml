name: upstream

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Upstream update available
      HOWTO: |
        To update the module, replace the files in `docker/nginx/nginx_upstream_check_module/`, then update `MODULE_COMMIT` in `scripts/check-upstream.sh` and the commit links in `README.md` and `README.ja.md`.
        To update nginx, change `NGINX_VERSION` in `docker/nginx/Dockerfile` and the version in both READMEs. Then check the module's patches (`check_<version>+.patch`) and use the newest one whose version is not above the new nginx version. Patch releases can need a new patch too (for example, `check_1.30.4+.patch` starts at 1.30.4).
        Close this issue once `./scripts/check-upstream.sh` reports up to date.
    steps:
      - uses: actions/checkout@v5
      - name: Open an issue when the module or nginx has an update
        run: |
          status=0
          report=$(./scripts/check-upstream.sh) || status=$?
          echo "$report"
          # 0: up to date, 1: update available, anything else: the check failed
          if [ "$status" -eq 0 ]; then
            exit 0
          elif [ "$status" -ne 1 ]; then
            exit "$status"
          fi
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq length)
          if [ "$open" -eq 0 ]; then
            printf '%s\n\n%s\n' "$report" "$HOWTO" |
              gh issue create --title "$TITLE" --body-file -
          fi
